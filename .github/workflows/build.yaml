name: Deploy Next.js static export to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Set repo env (for basePath/assetPrefix)
        run: echo "NEXT_PUBLIC_REPO_NAME=${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV

      - run: npm run build   # Next will export to ./out because output: "export" is set
        env:
          # Web3Forms access key for the /contact form. Add it under
          # Settings → Secrets and variables → Actions → Variables.
          # (Web3Forms keys are public by design, so a repo variable is fine.)
          NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ vars.NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
